name: Build and deploy

# Runs on every push to main and whenever the admin saves (the Pages Function calls workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Several admin saves in a row: let the running build finish, then run only the newest request.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://ramadan.islamonlive.in
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Without the Cloudflare secrets the job does nothing instead of failing.
      - name: Build (reads all content from D1)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy out --project-name=ramadan-islamonlive --branch=main

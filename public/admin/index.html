<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Ramadan.Islamonlive.in</title>
<style>
  :root {
    --brand: #d98a00; --brand-ink: #fff; --brand-soft: #fff4dd;
    --bg: #f5f5f3; --card: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --danger: #c62828; --ok: #1b7a3d; --radius: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --brand-soft: #3a2c0c; --bg: #151514; --card: #1f1f1d; --ink: #eeeeea; --muted: #9a9a93; --line: #333330; --danger: #ef6b6b; --ok: #5fcf88; --shadow: none }
  }
  * { box-sizing: border-box }
  html { -webkit-text-size-adjust: 100% }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg) }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px }
  button, input, select, textarea { font: inherit; color: inherit }

  /* shell */
  .shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh }
  aside.side { background: var(--card); border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px }
  .brand { font-weight: 700; padding: 4px 10px 14px; line-height: 1.2 }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem }
  .tab { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 12px; border: 0; border-radius: 8px; background: none; cursor: pointer; font-weight: 500 }
  .tab:hover { background: var(--bg) }
  .tab.on { background: var(--brand-soft); color: var(--brand); font-weight: 600 }
  .tab span { font-size: .75rem; color: var(--muted); font-weight: 400 }
  .side .sp { flex: 1 }
  .side a, .side .link { display: block; padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; background: none; border: 0; text-align: left; cursor: pointer; width: 100% }
  .side a:hover, .side .link:hover { background: var(--bg); color: var(--ink) }
  main { padding: 24px; max-width: 1100px; width: 100%; min-width: 0; margin: 0 auto }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap }
  .head h1 { font-size: 1.4rem; margin: 0; flex: 1 }

  /* controls */
  .btn { padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; font-weight: 500; white-space: nowrap }
  .btn:hover { border-color: var(--muted) }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600 }
  .btn.primary:hover { filter: brightness(1.07) }
  .btn.danger { color: var(--danger) }
  .btn.ghost { border-color: transparent; background: none; color: var(--muted) }
  .btn:disabled { opacity: .55; cursor: default }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--card) }
  input:focus, select:focus, textarea:focus { border-color: var(--brand) }
  textarea { resize: vertical; line-height: 1.55 }
  label.f { display: block; margin-bottom: 14px; font-size: .82rem; font-weight: 600; color: var(--muted) }
  label.f > :not(.hint) { margin-top: 5px; color: var(--ink); font-weight: 400; font-size: 15px }
  .hint { display: block; margin-top: 4px; font-size: .75rem; font-weight: 400; color: var(--muted) }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow) }
  .card h3 { margin: 0 0 12px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }

  /* list */
  .tools { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap }
  .tools input { flex: 1; min-width: 180px }
  .tools select { width: auto }
  .rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow) }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer }
  .row:last-child { border-bottom: 0 }
  .row:hover, .row:focus-visible { background: var(--brand-soft) }
  .row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .pill { font-size: .72rem; padding: 2px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
  .row time { font-size: .8rem; color: var(--muted); white-space: nowrap }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted) }
  .more { display: block; margin: 14px auto 0 }

  /* editor */
  .edit { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start }
  .edit .main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
  .edit .rail { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px }
  .title-in { font-size: 1.35rem; font-weight: 600; padding: 12px 14px }
  .editor { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden }
  .bar { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; align-items: center }
  .bar button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; min-width: 32px }
  .bar button:hover { background: var(--line) }
  .bar button.on { background: var(--card); box-shadow: 0 0 0 1px var(--line); font-weight: 600 }
  .bar .sp { flex: 1 }
  .editor textarea { border: 0; border-radius: 0; min-height: 420px; font: 13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace }
  .editor iframe { display: block; width: 100%; height: 480px; border: 0; background: #fff }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: .8rem }
  .chip button { border: 0; background: none; cursor: pointer; padding: 0 6px; font-size: 1rem; line-height: 1; color: inherit }
  .thumb { display: block; width: 100%; max-height: 170px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: var(--bg) }
  .savebar { display: flex; gap: 8px; flex-wrap: wrap }
  .savebar .btn.primary { flex: 1 }
  .back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; margin-bottom: 4px }
  .back:hover { color: var(--ink) }

  /* feedback */
  .banner { padding: 10px 14px; border-radius: 8px; background: #fdecea; color: #8a1c1c; margin-bottom: 14px }
  @media (prefers-color-scheme: dark) { .banner { background: #3b1a1a; color: #ffb4b4 } }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: #222; color: #fff; padding: 10px 18px; border-radius: 99px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 90vw }
  #toast.on { opacity: 1; transform: translate(-50%, 0) }
  #toast.err { background: var(--danger) }
  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); padding: 20px; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,.25) }
  dialog::backdrop { background: rgba(0,0,0,.45) }
  dialog p { margin: 0 0 16px }
  dialog .acts { display: flex; gap: 8px; justify-content: flex-end }
  .login { max-width: 360px; margin: 14vh auto 0; padding: 0 16px }
  .login .card { padding: 24px }
  .login h1 { font-size: 1.25rem; margin: 0 0 4px }
  .login p { margin: 0 0 18px; color: var(--muted) }

  @media (max-width: 880px) {
    .edit { grid-template-columns: 1fr } .edit .rail { position: static }
  }
  @media (max-width: 760px) {
    .shell { grid-template-columns: minmax(0, 1fr) }
    aside.side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line) }
    .brand { padding: 4px 8px; width: 100% } .side .sp { display: none }
    .tab { width: auto } .side a, .side .link { width: auto }
    main { padding: 16px }
    .row { grid-template-columns: 1fr auto } .row .pill { display: none }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const KINDS = {
  posts: { label: 'Posts', one: 'post' },
  authors: { label: 'Authors', one: 'author' },
  tags: { label: 'Tags', one: 'tag' },
  videos: { label: 'Videos', one: 'video' },
}
const ref = {}      // categories, authors, tags: feed the dropdowns
const cache = {}    // list per kind, dropped after every save
const app = document.getElementById('app')
let dirty = false

const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) k.startsWith('on') ? e.addEventListener(k.slice(2), v) : k === 'list' || k.includes('-') ? e.setAttribute(k, v) : (e[k] = v)
  e.append(...kids.flat().filter((k) => k != null && k !== false))
  return e
}
// WordPress titles hold HTML codes such as &#8211;; editors see (and save) plain text.
const dec = (s) => Object.assign(document.createElement('textarea'), { innerHTML: s || '' }).value
// Letters, marks (Malayalam vowel signs) and digits only; everything else becomes a dash.
const slugify = (s) => s.trim().toLowerCase().replace(/[^\p{L}\p{M}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 200)
const plainSlug = (s) => { try { return decodeURIComponent(s || '') } catch { return s || '' } } // WP stored some slugs percent-encoded
const ytId = (s) => (s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || [, s.trim()])[1]
const nowLocal = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 19)

let toastTimer
function toast(text, err) {
  const t = document.getElementById('toast')
  t.textContent = text; t.className = 'on' + (err ? ' err' : '')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), err ? 5000 : 2600)
}

async function api(path, method = 'GET', body) {
  const r = await fetch('/api/' + path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body && JSON.stringify(body) })
  const j = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== 'login') { login('Your session ended. Please log in again.'); throw new Error('Not logged in') }
  if (!r.ok) throw new Error(j.error || 'Something went wrong (' + r.status + ')')
  return j
}

const leave = () => !dirty || confirm('You have unsaved changes. Leave without saving?')
addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = '' } })

// Every screen has its own address (#/posts, #/posts/123, #/posts/new), so the browser Back button and reloads work.
const go = (hash) => { location.hash = hash }
const route = () => {
  const [, k, key] = location.hash.split('/').map(decodeURIComponent)
  const kind = KINDS[k] ? k : 'posts'
  key === 'new' ? edit(kind, null) : key ? edit(kind, key) : list(kind)
}
let current = location.hash
addEventListener('hashchange', () => {
  if (location.hash === current) return
  if (dirty && !confirm('You have unsaved changes. Leave without saving?')) return go(current) // put the address back
  dirty = false; current = location.hash; route()
})

/* ---------- login ---------- */
function login(message) {
  dirty = false
  const pw = h('input', { type: 'password', autocomplete: 'current-password', required: true, autofocus: true })
  const btn = h('button', { className: 'btn primary', style: 'width:100%' }, 'Log in')
  const err = h('div')
  const form = h('form', { onsubmit: async (e) => {
    e.preventDefault(); btn.disabled = true; btn.textContent = 'Checking…'
    try { await api('login', 'POST', { password: pw.value }); start() } catch (x) { err.replaceChildren(h('div', { className: 'banner' }, x.message)); btn.disabled = false; btn.textContent = 'Log in'; pw.select() }
  } }, err, h('label', { className: 'f' }, 'Password', pw), btn)
  app.replaceChildren(h('div', { className: 'login' }, h('div', { className: 'card' },
    h('h1', {}, 'Ramadan.Islamonlive.in'), h('p', {}, 'Sign in to manage the site'),
    message ? h('div', { className: 'banner' }, message) : null, form)))
}

/* ---------- shell ---------- */
// Authors and tags feed the dropdowns, so reload them (and drop cached lists) after every save.
async function refresh() {
  ;[ref.categories, ref.authors, ref.tags] = await Promise.all(['categories', 'authors', 'tags'].map((k) => api('items/' + k)))
  Object.keys(cache).forEach((k) => delete cache[k])
}
async function start() {
  try { await refresh() } catch { return }
  current = location.hash
  route()
}

function shell(kind, ...content) {
  const tabs = Object.entries(KINDS).map(([k, v]) =>
    h('button', { className: 'tab' + (k === kind ? ' on' : ''), onclick: () => go('#/' + k) }, v.label, h('span', {}, cache[k] ? cache[k].length : '')))
  app.replaceChildren(h('div', { className: 'shell' },
    h('aside', { className: 'side' }, h('div', { className: 'brand' }, 'Admin', h('small', {}, 'Ramadan.Islamonlive.in')), ...tabs, h('div', { className: 'sp' }),
      h('a', { href: '/', target: '_blank', rel: 'noopener' }, 'View site ↗'),
      h('button', { className: 'link', onclick: async () => { if (!leave()) return; dirty = false; await api('logout', 'POST'); login() } }, 'Log out')),
    h('main', {}, ...content)))
}

/* ---------- list ---------- */
async function list(kind) {
  shell(kind, h('p', { className: 'empty' }, 'Loading…'))
  let items = cache[kind]
  if (!items) {
    try { items = cache[kind] = await api('items/' + kind) } catch (e) { return shell(kind, h('div', { className: 'banner' }, e.message)) }
    items.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (a.name || '').localeCompare(b.name || ''))
    items.forEach((d) => (d._q = (dec(d.title || d.name) + ' ' + plainSlug(d.slug)).toLowerCase()))
  }
  const key = (d) => (kind === 'tags' ? d.slug : d.id)
  let shown = 50
  const rows = h('div', { className: 'rows' })
  const more = h('button', { className: 'btn more', onclick: () => { shown += 50; draw() } }, 'Show more')
  const search = h('input', { type: 'search', placeholder: `Search ${items.length} ${KINDS[kind].label.toLowerCase()}…`, oninput: () => { shown = 50; draw() } })
  const cat = kind === 'posts' ? h('select', { onchange: () => { shown = 50; draw() }, 'aria-label': 'Category' },
    h('option', { value: '' }, 'All categories'), ...ref.categories.map((c) => h('option', { value: c.slug }, dec(c.name)))) : null
  function draw() {
    const q = search.value.trim().toLowerCase()
    const hit = items.filter((d) => (!q || d._q.includes(q)) && (!cat || !cat.value || d.category === cat.value))
    rows.replaceChildren(...(hit.length ? hit.slice(0, shown).map((d) =>
      h('div', { className: 'row', tabIndex: 0, role: 'button', onclick: () => go(`#/${kind}/${encodeURIComponent(key(d))}`), onkeydown: (e) => e.key === 'Enter' && go(`#/${kind}/${encodeURIComponent(key(d))}`) },
        h('div', { className: 't' }, dec(d.title || d.name)),
        h('span', { className: 'pill' }, d.category ? (ref.categories.find((c) => c.slug === d.category)?.name || d.category) : plainSlug(d.slug)),
        h('time', {}, (d.date || '').slice(0, 10)))) : [h('div', { className: 'empty' }, 'Nothing found')]))
    more.style.display = hit.length > shown ? '' : 'none'
  }
  draw()
  shell(kind,
    h('div', { className: 'head' }, h('h1', {}, KINDS[kind].label), h('button', { className: 'btn primary', onclick: () => go(`#/${kind}/new`) }, '+ New ' + KINDS[kind].one)),
    h('div', { className: 'tools' }, search, cat), rows, more)
}

/* ---------- editor ---------- */
const field = (label, el, hint) => h('label', { className: 'f' }, label, el, hint ? h('span', { className: 'hint' }, hint) : null)

async function edit(kind, key) {
  let item = {}
  if (key !== null) try { item = await api(`items/${kind}/${encodeURIComponent(key)}`) } catch (e) { return toast(e.message, true) }
  const isNew = key === null
  let slugTouched = !isNew
  const get = {}   // field name -> () => value
  const touch = () => (dirty = true)
  const input = (f, attrs = {}) => { const el = h('input', { oninput: touch, ...attrs }); get[f] = () => el.value; return el }

  const title = input(kind === 'authors' || kind === 'tags' ? 'name' : 'title', { value: dec(item.title ?? item.name ?? ''), className: 'title-in', placeholder: kind === 'posts' ? 'Post title' : 'Name', required: true })
  const slug = input('slug', { value: plainSlug(item.slug), placeholder: 'web-address', readOnly: kind === 'tags' && !isNew })
  slug.addEventListener('input', () => (slugTouched = true))
  title.addEventListener('input', () => { if (!slugTouched) slug.value = slugify(title.value) })
  const slugField = field('Web address (slug)', slug, kind === 'tags' && !isNew ? 'A tag\'s address cannot be changed.' : 'Part of the page link. No spaces.')

  const date = h('input', { type: 'datetime-local', step: 1, value: (item.date || nowLocal()).slice(0, 19), oninput: touch }); get.date = () => date.value
  const dateField = field('Date', date)

  const err = h('div')
  let editorCard = null, rail = []

  if (kind === 'posts') {
    const cat = h('select', { onchange: touch }, ...ref.categories.map((c) => h('option', { value: c.slug }, dec(c.name)))); cat.value = item.category ?? ref.categories[0].slug; get.category = () => cat.value
    const au = h('select', { onchange: touch }, ...[...ref.authors].sort((a, b) => a.name.localeCompare(b.name)).map((a) => h('option', { value: a.id }, a.name))); au.value = item.authorId ?? ref.authors[0].id; get.authorId = () => +au.value

    let tags = [...(item.tags || [])]
    const chips = h('div', { className: 'chips' })
    const tagName = (s) => dec(ref.tags.find((t) => t.slug === s)?.name || plainSlug(s))
    const drawTags = () => chips.replaceChildren(...tags.map((t) => h('span', { className: 'chip' }, tagName(t), h('button', { type: 'button', 'aria-label': 'Remove ' + tagName(t), onclick: () => { tags = tags.filter((x) => x !== t); touch(); drawTags() } }, '×'))))
    const tagIn = h('input', { list: 'taglist', placeholder: 'Type to add a tag…', onkeydown: (e) => {
      if (e.key !== 'Enter' && e.key !== ',') return
      e.preventDefault()
      const v = tagIn.value.trim().toLowerCase(); if (!v) return
      const t = ref.tags.find((t) => plainSlug(t.slug).toLowerCase() === v || dec(t.name).toLowerCase() === v)
      if (!t) return toast('That tag does not exist yet. Create it in the Tags tab first.', true)
      if (!tags.includes(t.slug)) { tags.push(t.slug); touch(); drawTags() }
      tagIn.value = ''
    } })
    get.tags = () => tags
    drawTags()

    const img = h('input', { value: item.image || '', placeholder: '/uploads/2026/03/photo.jpg', oninput: () => { touch(); preview() } }); get.image = () => img.value
    const thumb = h('img', { className: 'thumb', alt: '', onerror: () => (thumb.style.display = 'none') })
    const preview = () => { thumb.style.display = img.value.trim() ? '' : 'none'; if (img.value.trim()) thumb.src = img.value.trim() }
    preview()

    const yt = h('input', { value: item.video || '', placeholder: 'Paste a YouTube link or ID', oninput: touch, onchange: () => { yt.value = ytId(yt.value); vthumb() } }); get.video = () => ytId(yt.value)
    const vt = h('img', { className: 'thumb', alt: '', onerror: () => (vt.style.display = 'none') })
    const vthumb = () => { const id = ytId(yt.value); vt.style.display = /^[\w-]{11}$/.test(id) ? '' : 'none'; if (/^[\w-]{11}$/.test(id)) vt.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg` }
    vthumb()

    const excerpt = h('textarea', { rows: 3, value: item.excerpt || '', oninput: touch }); get.excerpt = () => excerpt.value

    // Body editor: plain HTML with a small toolbar and a safe preview.
    const body = h('textarea', { value: item.content || '', oninput: touch, spellcheck: false }); get.content = () => body.value
    const frame = h('iframe', { sandbox: '', title: 'Preview', style: 'display:none' })
    const wrap = (a, b = '') => {
      const s = body.selectionStart, e = body.selectionEnd, sel = body.value.slice(s, e)
      body.setRangeText(a + sel + b, s, e, 'select'); body.focus(); touch()
    }
    const btn = (label, fn, title) => h('button', { type: 'button', title: title || label, onclick: fn }, label)
    const write = btn('Write', () => show(false)), view = btn('Preview', () => show(true))
    const show = (p) => {
      write.className = p ? '' : 'on'; view.className = p ? 'on' : ''
      body.style.display = p ? 'none' : ''; frame.style.display = p ? '' : 'none'; tools.style.visibility = p ? 'hidden' : ''
      // Sandboxed so pasted scripts in a post cannot reach the admin session.
      if (p) frame.srcdoc = `<meta charset="utf-8"><body style="font:17px/1.8 system-ui,sans-serif;max-width:720px;margin:20px auto;padding:0 16px">${body.value}`
    }
    const tools = h('span', {}, btn('B', () => wrap('<strong>', '</strong>'), 'Bold'), btn('I', () => wrap('<em>', '</em>'), 'Italic'), btn('H2', () => wrap('<h2>', '</h2>'), 'Heading'),
      btn('¶', () => wrap('<p>', '</p>'), 'Paragraph'), btn('❝', () => wrap('<blockquote>', '</blockquote>'), 'Quote'), btn('• List', () => wrap('<ul>\n<li>', '</li>\n</ul>'), 'Bullet list'),
      btn('Link', () => { const u = prompt('Link address (https://…)'); if (u) wrap(`<a href="${u.replace(/"/g, '&quot;')}">`, '</a>') }),
      btn('Image', () => { const u = prompt('Image address (/uploads/… or https://…)'); if (u) wrap(`<img src="${u.replace(/"/g, '&quot;')}" alt="">`) }))
    editorCard = h('div', { className: 'editor' }, h('div', { className: 'bar' }, write, view, h('span', { className: 'sp' }), tools), body, frame)
    show(false)

    rail = [
      h('div', { className: 'card' }, h('h3', {}, 'Details'), slugField, field('Category', cat), field('Author', au), dateField),
      h('div', { className: 'card' }, h('h3', {}, 'Tags'), chips, tagIn, h('datalist', { id: 'taglist' }, ...ref.tags.map((t) => h('option', { value: dec(t.name) })))),
      h('div', { className: 'card' }, h('h3', {}, 'Featured image'), thumb, img, h('span', { className: 'hint' }, 'Image upload is not available yet. Use an existing /uploads path or a link.')),
      h('div', { className: 'card' }, h('h3', {}, 'YouTube video'), vt, yt, h('span', { className: 'hint' }, 'Only for video posts. Shown instead of the image.')),
      h('div', { className: 'card' }, h('h3', {}, 'Excerpt'), excerpt, h('span', { className: 'hint' }, 'Optional short summary for lists and search results.')),
    ]
  } else if (kind === 'authors') {
    const d = h('textarea', { rows: 5, value: item.description || '', oninput: touch }); get.description = () => d.value
    rail = [h('div', { className: 'card' }, h('h3', {}, 'Details'), slugField, field('About the author', d))]
  } else if (kind === 'videos') {
    const yt = h('input', { value: item.video || '', placeholder: 'Paste a YouTube link or ID', oninput: touch, onchange: () => (yt.value = ytId(yt.value)) }); get.video = () => ytId(yt.value)
    rail = [h('div', { className: 'card' }, h('h3', {}, 'Details'), slugField, dateField, field('YouTube video', yt))]
  } else {
    rail = [h('div', { className: 'card' }, h('h3', {}, 'Details'), slugField)]
  }

  const saveBtn = h('button', { className: 'btn primary' }, isNew ? 'Create' : 'Save changes')
  const save = async () => {
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; err.replaceChildren()
    try {
      const body = Object.fromEntries(Object.entries(get).map(([f, fn]) => [f, fn()]))
      body[kind === 'authors' || kind === 'tags' ? 'name' : 'title'] = title.value
      await api(isNew ? 'items/' + kind : `items/${kind}/${encodeURIComponent(key)}`, isNew ? 'POST' : 'PUT', body)
      dirty = false; toast('Saved. The change is live on the site.'); await refresh(); go('#/' + kind)
    } catch (e) { err.replaceChildren(h('div', { className: 'banner' }, e.message)); toast(e.message, true); saveBtn.disabled = false; saveBtn.textContent = isNew ? 'Create' : 'Save changes' }
  }
  saveBtn.onclick = save
  const dlg = h('dialog', {}, h('p', {}, `Delete this ${KINDS[kind].one} for good? It disappears from the site straight away.`),
    h('div', { className: 'acts' }, h('button', { className: 'btn', onclick: () => dlg.close() }, 'Keep it'),
      h('button', { className: 'btn danger', onclick: async () => { dlg.close(); try { await api(`items/${kind}/${encodeURIComponent(key)}`, 'DELETE'); dirty = false; toast('Deleted'); await refresh(); go('#/' + kind) } catch (e) { toast(e.message, true) } } }, 'Delete')))
  const actions = h('div', { className: 'card' }, h('div', { className: 'savebar' }, saveBtn,
    h('button', { className: 'btn', onclick: () => go('#/' + kind) }, 'Cancel'),
    isNew ? null : h('button', { className: 'btn danger', onclick: () => dlg.showModal() }, 'Delete')))

  shell(kind,
    h('button', { className: 'back', onclick: () => go('#/' + kind) }, '← ' + KINDS[kind].label),
    h('div', { className: 'head' }, h('h1', {}, (isNew ? 'New ' : 'Edit ') + KINDS[kind].one)),
    err,
    h('div', { className: kind === 'posts' ? 'edit' : 'edit', style: kind === 'posts' ? '' : 'grid-template-columns:minmax(0,560px)' },
      h('div', { className: 'main' }, title, editorCard),
      h('div', { className: 'rail' }, actions, ...rail)),
    dlg)
  dirty = false
  title.focus()
}

addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { const b = [...document.querySelectorAll('.savebar .primary')][0]; if (b) { e.preventDefault(); b.click() } }
})

api('me').then(() => start(), () => login())
</script>
</body>
</html>
